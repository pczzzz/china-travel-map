<style>
/* 行前清单（完整版）专属样式，前缀 gk- */
.gk-bar{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.gk-mode{display:flex;gap:8px;flex-wrap:wrap}
.gk-mode .btn.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.gk-tools{display:flex;flex-direction:column;gap:11px;padding-top:13px;border-top:1px dashed var(--line2)}
.gk-tools .chips{display:flex;gap:7px;flex-wrap:wrap}
.gk-tools input[type=search]{padding:9px 13px;border:1px solid var(--line);border-radius:var(--r-btn);
  font-size:13.5px;background:#fff;max-width:380px;color:var(--ink)}
.gk-tools input[type=search]:focus{outline:0;border-color:var(--cta)}
.gk-g{border:1px solid var(--line);border-radius:var(--r-card);background:#FCFBF9;padding:14px 16px 6px;margin-bottom:14px}
.gk-gh{display:flex;align-items:baseline;gap:10px;margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid var(--line2)}
.gk-gh h4{font-size:16px;color:var(--ink)}
.gk-cnt{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;
  background:#F2EFE9;padding:2px 9px;border-radius:10px}
.gk-cnt.done{background:#31664A;color:#fff;font-weight:700}
.gk-cat{margin-bottom:11px}
.gk-cat>b{display:block;font-size:13px;color:var(--cta);font-weight:800;margin-bottom:6px;letter-spacing:.02em}
.gk-cat>b i{font-style:normal;font-size:11px;color:var(--muted);font-weight:600;margin-left:6px}
.gk-cat ul{list-style:none;padding:0;margin:0;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:5px 16px}
.gk-cat li{padding:0}
.gk-cat .ck{align-items:flex-start;padding:4px 0}
.gk-cat .ck input{margin-top:3px;flex:0 0 auto}
.gk-cat .ck>span{flex:1;line-height:1.7}
.gk-q{display:inline-block;margin-left:7px;font-size:11px;font-weight:700;color:#8A6420;
  background:#F7EFDF;border:1px solid #EBDCBF;border-radius:9px;padding:0 7px;vertical-align:1px}
.gk-n{display:block;font-size:11.8px;color:var(--muted);line-height:1.65;margin-top:2px}
@media(max-width:640px){.gk-cat ul{grid-template-columns:1fr}}
</style>
