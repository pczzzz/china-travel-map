<!DOCTYPE html>

<body>

<header class="topbar" id="topbar">
  <a class="brand" href="index.html">
    <span class="brand-mark">旅</span>
    <span class="brand-txt">中国旅行地图<em>国道 · 省份 · 主题</em></span>
  </a>
  <nav class="nav" id="mainnav"></nav>
  <a class="btn btn-ghost btn-sm" href="favorites.html?tab=visited" id="navVisited" title="查看我的已去清单">已去 0</a>
</header>

<section class="page-head" id="pvHead"></section>

<section class="sec sec-tight" id="geo">
  <div class="wrap">
    <div class="sec-head">
      <div>
        <div class="eyebrow">GEOGRAPHY · 地理速览</div>
        <h2 id="geoH2">三大板块，一省三种玩法</h2>
      </div>
    </div>
    <div class="grows" id="regions"></div>
  </div>
</section>

<section class="sec" id="cities" style="background:var(--bg2)">
  <div class="wrap">
    <div class="sec-head">
      <div>
        <div class="eyebrow">CITIES · 城市与景点</div>
        <h2 id="cityTitle"></h2>
      </div>
    </div>
    <div class="pv-top">
      <div class="pv-map pv-map-big"><div class="leaflet-map" id="pvMap"></div></div>
      <aside class="pv-rail pv-rail-single">
        <div class="railbox citynav" id="cityNav">
          <div class="tt">城市筛选 · 与分类可叠加</div>
          <div class="cnav-scroll">
            <div class="citybar" id="cityBar"></div>
          </div>
          <div class="catrow"><span class="catlbl">分类</span><div class="catpicks" id="catChips"></div></div>
          <div class="cityintro" id="cityIntro"></div>
        </div>
      </aside>
    </div>
    <div class="acards" id="spotGrid" style="margin-top:16px"></div>
    <div class="spotmore" id="spotMore"></div>
  </div>
</section>

<section class="sec sec-tight" id="foods">
  <div class="wrap">
    <div class="sec-head">
      <div>
        <div class="eyebrow">FOOD · 代表味道</div>
        <h2 id="foodH2">13 味地方代表，吃到哪算哪</h2>
      </div>
    </div>
    <div class="foodlist" id="foodList"></div>
    <p class="foodnote" id="foodNote"></p>
  </div>
</section>

<section class="sec" id="loops" style="background:var(--bg2)">
  <div class="wrap">
    <div class="sec-head">
      <div>
        <div class="eyebrow">LOOPS · 省内环线</div>
        <h2 id="loopH2">5 条环线，从 4 天到 9 天</h2>
      </div>
    </div>
    <div class="looplist" id="loopList"></div>
  </div>
</section>

<section class="sec sec-tight" id="features" hidden>
  <div class="wrap">
    <div class="sec-head">
      <div>
        <div class="eyebrow">HIGHLIGHTS · 省份特色</div>
        <h2 id="featH2">一省几张名片</h2>
      </div>
    </div>
    <p class="featintro" id="featIntro"></p>
    <div class="featgrid" id="featGrid"></div>
    <p class="featnote" id="featNote"></p>
  </div>
</section>

<section class="sec sec-tight" id="tips">
  <div class="wrap">
    <div class="sec-head">
      <div>
        <div class="eyebrow">TIPS · 实用提示</div>
        <h2 id="tipH2">出发前读一遍的七件事</h2>
      </div>
    </div>
    <div class="grows" id="tipList"></div>
  </div>
</section>

<footer class="foot">
  <div class="wrap">
    <div class="cp">
      <span><a href="provinces.html">← 省份总览</a></span>

      <span><a href="themes.html">主题玩法 →</a></span>
    </div>
  </div>
</footer>
